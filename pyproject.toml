[project]
name = "BioBot"
version = "0.1.0"
description = "BioBot"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.0",
    "aioimaplib>=2.0.1",
    "aiosmtplib>=4.0.2",
    "arknights-game-model",
    "nb-cli>=1.4.2",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot2[fastapi]>=2.4.3",
    "pil-utils>=0.2.2",
    "pillow>=11.3.0",
    "pydantic[email]>=2.12.1",
    "quart>=0.20.0",
]

[tool.nonebot]
adapters = [
    { name = "Onebot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = []
builtin_plugins = []

[tool.uv.sources]
arknights-game-model = { path = "~/arknights/arknights-game-model", editable = true }
