[project]
name = "BioBot"
version = "0.1.0"
description = "BioBot"
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "aioimaplib>=2.0.1",
    "aiosmtplib>=5.1.0",
    "arknights-game-model",
    "nb-cli>=1.7.3",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-orm[sqlite]>=0.8.3",
    "nonebot2[fastapi]>=2.5.0",
    "pil-utils>=0.2.2",
    "pillow>=11.3.0",
    "pydantic[email]>=2.13.2",
]

[dependency-groups]
dev = [
    "nonebot2[websockets]>=2.5.0",
]

[tool.nonebot]
plugin_dirs = []
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = [
    "src.plugins.autoreply"
]
nonebot-plugin-orm = ["nonebot_plugin_orm"]

[tool.uv.sources]
arknights-game-model = { git = "https://github.com/BiologyHazard/arknights-game-model", rev = "main" }
